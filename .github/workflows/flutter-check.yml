name: Flutter checks
on:
  push:
    branches: [feature/group-planners, feature/web-app]
  workflow_dispatch:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: taskhub-web
          path: build/web
          if-no-files-found: error
